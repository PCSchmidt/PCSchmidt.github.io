name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Check out the SITREP app source
        uses: actions/checkout@v4
        with:
          # Public repository: the default GITHUB_TOKEN can read it, so the web app
          # needs no extra secret or cross-repo deploy key.
          repository: PCSchmidt/SITREP
          path: sitrep-src

      - name: Build the SITREP web app
        working-directory: sitrep-src/mobile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # app.json sets experiments.baseUrl to /sitrep so asset URLs resolve from
          # the subpath this site serves the app from.
          npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/sitrep-web"

      - name: Publish the SITREP web app into the site
        run: |
          set -euo pipefail
          # Replace only the app-owned files so the hand-written /sitrep page is
          # untouched. privacy-policy.html and terms.html live in that folder and are
          # linked from the app store listings, so they must survive every deploy.
          rm -rf public/sitrep/_expo public/sitrep/assets public/sitrep/index.html public/sitrep/favicon.ico public/sitrep/metadata.json
          mkdir -p public/sitrep
          cp -R sitrep-web/. public/sitrep/
          echo "SITREP web app files:"; ls -1 public/sitrep | head -20

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
